plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.systemttssynthesis'
version = '0.1.0'

android {
  namespace "expo.modules.systemttssynthesis"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.media:media:1.7.0"
}
